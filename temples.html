<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album</title>
  <meta name="description" content="Temple Album page for WDD 131 assignment.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS (Mobile First + Large View) -->
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  
  <!-- JavaScript (Deferred) -->
  <script src="scripts/temples.js" defer></script>
</head>
<body>

  <header>
    <span>Temple Album</span>
    <button id="menu" aria-label="Toggle Navigation"></button>
    <nav>
      <a href="#">Home</a>
      <a href="#">Old</a>
      <a href="#">New</a>
      <a href="#">Large</a>
      <a href="#">Small</a>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <div class="res-grid">
      <figure>
        <img src="images/templo_caracas.jpg" alt="Caracas Temple" loading="lazy">
        <figcaption>Caracas, Venezuela</figcaption>
      </figure>
      <figure>
        <img src="images/templo_new_york.webp" alt="New York City Temple" loading="lazy">
        <figcaption>New York</figcaption>
      </figure>
      <figure>
        <img src="images/templo_chicago.jpg" alt="Chicago Temple" loading="lazy">
        <figcaption>Chicago</figcaption>
      </figure>
      <figure>
        <img src="images/templo_paris.jpg" alt="Paris Temple" loading="lazy">
        <figcaption>Paris</figcaption>
      </figure>
      <figure>
        <img src="images/templo_barcelona.jpg" alt="Barcelona Temple" loading="lazy">
        <figcaption>Barcelona</figcaption>
      </figure>
      <figure>
        <img src="images/templo_london.jpg" alt="London Temple" loading="lazy">
        <figcaption>London</figcaption>
      </figure>
      <figure>
        <img src="images/templo_rome.jpg" alt="Rome Temple" loading="lazy">
        <figcaption>Rome, Italy</figcaption>
      </figure>
      <figure>
        <img src="images/templo_toronto.jpg" alt="Toronto Temple" loading="lazy">
        <figcaption>Toronto</figcaption>
      </figure>
      <figure>
        <img src="images/templo_oakland.jpg" alt="Oakland California Temple" loading="lazy">
        <figcaption>Oakland, California</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Sebastian Medina, Venezuela</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
